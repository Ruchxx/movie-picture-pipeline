name: Frontend CD

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: CI=true npm test

  build-and-push:
    needs: [lint, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    outputs:
      registry: ${{ steps.ecr-login.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login
      - run: docker build --build-arg REACT_APP_MOVIE_API_URL=http://ab72fea3a2f684f7a9ff366863e8c2e7-1806090073.us-east-1.elb.amazonaws.com -t ${{ steps.ecr-login.outputs.registry }}/frontend:${{ github.sha }} .
      
      - run: docker push ${{ steps.ecr-login.outputs.registry }}/frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/k8s
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - run: aws eks update-kubeconfig --name cluster --region us-east-1
      - uses: imranismail/setup-kustomize@v2
      - run: |
          kustomize edit set image frontend=${{ needs.build-and-push.outputs.registry }}/frontend:${{ github.sha }}
          kustomize build . | kubectl apply --validate=false -f -
      - name: Verify rollout and print service URL
        run: |
          kubectl rollout status deployment/frontend --timeout=120s
          kubectl get svc frontend -o wide
      